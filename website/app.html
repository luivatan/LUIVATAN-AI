<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apex AI — Chat</title><link rel="stylesheet" href="styles.css"><style>body{background:var(--bg)}.shell-app{height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:14px}.side-title{padding:0 12px}.side-button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:12px;border-radius:5px;text-align:left;cursor:pointer}.side-button.primary{background:var(--lime);border-color:var(--lime);color:#16211c}.side-label{font:10px 'DM Mono';color:var(--muted);padding:15px 12px 3px;text-transform:uppercase;letter-spacing:.1em}.history{color:var(--muted);font-size:13px;padding:9px 12px}.side-bottom{margin-top:auto}.chat{display:flex;flex-direction:column;min-width:0}.chat-top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 35px}.model{border:1px solid var(--line);padding:9px 12px;border-radius:6px;font-size:12px}.messages{flex:1;overflow:auto;max-width:800px;width:100%;margin:auto;padding:50px 28px}.empty{text-align:center;margin-top:16vh}.empty h1{font-size:42px;letter-spacing:-.06em}.empty p{color:var(--muted)}.suggestions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:25px}.suggestions button{padding:10px 14px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:20px;cursor:pointer}.bubble{padding:18px 0;line-height:1.65;white-space:pre-wrap}.bubble.user{color:var(--muted);border-bottom:1px solid var(--line)}.bubble.ai{font-size:16px}.composer-wrap{padding:20px 28px 30px}.composer{max-width:800px;margin:auto;display:flex;gap:10px;align-items:end;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card)}textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font:15px 'DM Sans';padding:8px}.send{border:0;border-radius:8px;background:var(--lime);padding:11px 15px;cursor:pointer}.attach{cursor:pointer;color:var(--muted);padding:10px}.attach input{display:none}.source{font-size:12px;color:#78915e;border-left:2px solid var(--lime);padding:5px 10px;margin-top:8px}@media(max-width:700px){.shell-app{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:flex;position:fixed;z-index:5;background:var(--bg);height:100%;width:260px}.chat-top{padding:0 16px}.messages{padding:30px 18px}.composer-wrap{padding:12px}.empty h1{font-size:34px}.menu-mobile{display:block!important}.side-bottom{margin-top:auto}}.menu-mobile{display:none;background:none;border:0;color:var(--ink);font-size:20px}</style></head><body><div class="shell-app"><aside class="sidebar" id="sidebar"><div class="side-title"><a class="brand" href="index.html"><span class="brand-mark">⌁</span><span>Apex<span class="accent">AI</span></span></a></div><button class="side-button primary" onclick="newChat()">＋ New chat</button><input class="input" id="search" placeholder="Search conversations"><div class="side-label">Conversations</div><div class="history" id="history">No conversations yet</div><div class="side-bottom"><button class="side-button" onclick="alert('Document management is available through upload in chat.')">▧ Documents</button><button class="side-button">▦ Projects</button><button class="side-button">⚙ Settings</button><button class="side-button" onclick="logout()">↪ Log out</button></div></aside><section class="chat"><header class="chat-top"><button class="menu-mobile" onclick="sidebar.classList.toggle('open')">☰</button><strong>Apex AI</strong><span class="model">Model: configured AI ▾</span></header><main class="messages" id="messages"><div class="empty" id="empty"><div class="brand" style="justify-content:center;font-size:34px"><span class="brand-mark">⌁</span></div><h1>How can Apex AI help?</h1><p>Ask a question, or give Apex a document to understand.</p><div class="suggestions"><button onclick="suggest('Explain something clearly')">Explain something</button><button onclick="suggest('Analyze my document')">Analyze a document</button><button onclick="suggest('Help me code')">Help me code</button><button onclick="suggest('Write something for me')">Write something</button></div></div></main><div class="composer-wrap"><div class="composer"><label class="attach">📎<input id="file" type="file" accept="application/pdf" onchange="upload()"></label><textarea id="question" rows="1" placeholder="Message Apex AI…"></textarea><button class="send" onclick="ask()">↑</button></div><div class="status" id="status" style="text-align:center;margin-top:10px"></div></div></section></div><script src="app.js"></script></body></html>
