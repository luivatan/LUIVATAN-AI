<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apex AI Workspace</title><link rel="stylesheet" href="styles.css"><style>.app{max-width:900px;margin:60px auto}.panel{background:var(--card);padding:28px;margin:18px 0;border-radius:4px}.input{width:100%;padding:14px;margin:8px 0;border:1px solid var(--line);background:var(--bg);color:var(--ink)}.status{color:#78915e;min-height:24px}.answer{white-space:pre-wrap;line-height:1.6}.citation{border-left:3px solid var(--lime);padding:10px 16px;margin:10px 0;background:var(--bg)}</style></head><body><nav class="nav shell"><a class="brand" href="index.html"><span class="brand-mark">⌁</span><span>Apex<span class="accent">AI</span></span></a><button class="button button-ghost" onclick="logout()">Log out</button></nav><main class="app"><div class="eyebrow">APEX WORKSPACE</div><h1>Ask your <em>documents.</em></h1><section class="panel"><h3>Sign in</h3><input class="input" id="email" placeholder="Email"><input class="input" id="password" type="password" placeholder="Password"><button class="button button-primary" onclick="login()">Sign in →</button><p class="status" id="authStatus"></p></section><section class="panel"><h3>Upload a PDF</h3><input id="file" type="file" accept="application/pdf"><button class="button button-primary" onclick="upload()">Upload document →</button><p class="status" id="uploadStatus"></p></section><section class="panel"><h3>Ask a question</h3><textarea class="input" id="question" rows="3" placeholder="What would you like to understand?"></textarea><button class="button button-primary" onclick="ask()">Ask Apex →</button><p class="status" id="askStatus"></p><div class="answer" id="answer"></div><div id="citations"></div></section></main><script src="app.js"></script></body></html>
